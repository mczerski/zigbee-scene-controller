manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: ncs-zigbee
      repo-path: ncs-zigbee
      remote: ncs
      revision: v0.4.0
      import:
        name-allowlist:
          # Core repositories
          - nrf
          - zephyr
          # Zephyr modules
          - cmsis
          - hal_nordic
          - picolibc
          #- zcbor               # used by MCUboot serial recovery / mcumgr
          # Crypto
          - mbedtls
          - oberon-psa-crypto
          - nrfxlib
          # Bootloader
          #- mcuboot
  self:
    path: zigbee-scene-controller
